<style>

:root{--bg:#000;--ink:#fff;--mute:#b3b3b3;--acc:#F1BB00;--on-acc:#000;--panel:#111;--panel2:#1b1b1b;--line:#303030;--ok:#4cd27a;--warn:#ff8a5c;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--body)}
button{font:inherit;color:inherit}
[hidden]{display:none!important}

<body>
<div id="app"><div class="center"><p class="muted">Cargando…</p></div></div>
<script src="config.js"></script>
<script src="geo.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"></script>
<script src="map.js"></script>
<script type="module">
import { ref, col, getDoc, setDoc, updateDoc, onSnapshot, query, where, deleteField, keyOf, login, onUser, logout } from './fb.js';
const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => '$ ' + Math.round(n || 0).toLocaleString('es-AR');
const ls = { get: k => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch { } } };

let EMAIL = '', ME = '', LOC = null, orders = [], listos = [], order = [], unsub = [];
const quitados = new Set(); // listos que Nacho destildó
let pos = null, gps = 'idle', watchId = null, lastSent = 0, lock = null;
const screen = html => { render.last = null; $app.innerHTML = html; };
const center = html => screen('<div class="center">' + html + '</div>');

/* ── entrada ── */
function loginScreen() {
  center('<div class="wm" style="font-size:40px">Reparto</div><p class="muted">Entrá con tu cuenta de Google para ver tus pedidos.</p><button class="go" id="g" style="max-width:320px">Entrar</button>');
  document.getElementById('g').onclick = login;
}
onUser(async user => {
  if (!user) return loginScreen();
  EMAIL = (user.email || '').toLowerCase();
  center('<p class="muted">Cargando…</p>');
  try {
    const s = await getDoc(ref());
    LOC = s.exists() ? s.data() : null;
  } catch (e) { console.error(e); LOC = null; }
  ME = LOC && LOC.riders && LOC.riders[keyOf(EMAIL)];
  if (!ME) {
    center('<h2>Sin acceso</h2><p class="muted">La cuenta ' + esc(EMAIL) + ' no figura como repartidor. Pedile al local que la agregue en Ajustes.</p><button class="btn" id="out">Salir</button>');
    document.getElementById('out').onclick = logout; return;
  }
  if (LOC.color && /^#[0-9a-f]{6}$/i.test(LOC.color)) document.documentElement.style.setProperty('--acc', LOC.color);
  try { order = JSON.parse(ls.get('rep_order') || '[]'); } catch { order = []; }
  watchOrders();
});

/* ── pedidos ── */
function watchOrders() {
  unsub.forEach(u => u()); unsub = [];
  const fail = err => { console.error(err); center('<h2>Sin conexión con el local</h2><p class="muted">' + esc(err.code) + '</p><button class="btn" onclick="location.reload()">Reintentar</button>'); };
  // En camino con este repartidor.
  unsub.push(onSnapshot(query(col('pedidos'), where('repartidorEmail', '==', EMAIL), where('estado', '==', 'camino')), snap => {
    orders = []; snap.forEach(d => orders.push(d.data()));
    sync();
  }, fail));
  // Listos para salir (los ve cualquier repartidor del local).
  unsub.push(onSnapshot(query(col('pedidos'), where('estado', '==', 'listo')), snap => {
    listos = []; snap.forEach(d => listos.push(d.data()));
    listos.sort((a, b) => a.creado - b.creado);
    [...quitados].forEach(id => { if (!listos.some(o => o.id === id)) quitados.delete(id); });
    render();
  }, fail));
}
function stops() {
  const rank = id => { const i = order.indexOf(id); return i < 0 ? 1e9 : i; };
  return orders.slice().sort((a, b) => rank(a.id) - rank(b.id) || (a.orden || 0) - (b.orden || 0) || (a.salio || a.creado || 0) - (b.salio || b.creado || 0));
}
const geoTried = new Set();
function ensureGeo(o) {
  if (o.geo || geoTried.has(o.id) || !o.dir) return;
  geoTried.add(o.id);
  GEO.geocode(o.dir).then(g => {
    if (!g) return;
    o.geo = g;
    updateDoc(ref('pedidos', o.id), { geo: g, upd: Date.now() }).catch(() => { });
    if (o.track) updateDoc(ref('track', o.track), { dest: { lat: g.lat, lng: g.lng } }).catch(() => { });
    publish(true); render();
  });
}
function sync() {
  const s = stops();
  s.forEach(ensureGeo);
  if (s.length && watchId === null) startGps();
  if (!s.length && watchId !== null) stopGps();
  s.forEach(o => { if (o.track) updateDoc(ref('track', o.track), { estado: o.llegoT ? 'llego' : 'camino', repartidor: ME, upd: Date.now() }).catch(() => { }); });
  publish(true); render();
}

/* ── GPS ── */
function startGps() {
  if (!navigator.geolocation) { gps = 'no'; return; }
  gps = 'wait';
  watchId = navigator.geolocation.watchPosition(onPos, e => { gps = e.code === 1 ? 'denied' : 'wait'; render(); }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 30000 });
  wake();
}
function stopGps() {
  if (watchId !== null) navigator.geolocation.clearWatch(watchId);
  watchId = null; gps = 'idle';
  if (pos) setDoc(ref('pos', keyOf(EMAIL)), { name: ME, activo: false, t: Date.now() }).catch(() => { });
  pos = null;
  lock && lock.release().catch(() => { }); lock = null;
}
function onPos(p) {
  const c = { lat: p.coords.latitude, lng: p.coords.longitude };
  let hdg = pos ? pos.hdg : 0;
  if (p.coords.heading != null && isFinite(p.coords.heading) && (p.coords.speed || 0) > 1) hdg = p.coords.heading;
  else if (pos && GEO.dist(pos, c) > 8) hdg = GEO.bearing(pos, c);
  pos = { ...c, hdg: Math.round(hdg), acc: Math.round(p.coords.accuracy || 0), t: Date.now() };
  gps = 'ok';
  publish(false); render();
}
async function wake() {
  try { if ('wakeLock' in navigator && !lock && document.visibilityState === 'visible') { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => { lock = null; render(); }); render(); } } catch { }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && watchId !== null) { wake(); publish(true); } });
function publish(force) {
  const now = Date.now();
  if (!pos || !ME) return;
  if (!force && now - lastSent < 4000) return;
  lastSent = now;
  const s = stops();
  setDoc(ref('pos', keyOf(EMAIL)), { name: ME, lat: pos.lat, lng: pos.lng, hdg: pos.hdg, t: now, activo: true }).catch(() => { });
  s.forEach((o, i) => {
    if (!o.track) return;
    const eta = GEO.etaMin(pos, s.slice(0, i + 1).map(x => x.geo));
    updateDoc(ref('track', o.track), {
      moto: { lat: pos.lat, lng: pos.lng, hdg: pos.hdg, t: now }, antes: i, etaMin: eta, estado: o.llegoT ? 'llego' : 'camino', repartidor: ME, upd: now
    }).catch(() => { });
  });
}
setInterval(() => publish(true), 20000);

/* ── acciones ── */
function llego(o) {
  const t = Date.now();
  o.llegoT = t;
  updateDoc(ref('pedidos', o.id), { llegoT: t, upd: t }).catch(e => toast('No se pudo guardar: ' + e.code));
  if (o.track) updateDoc(ref('track', o.track), { estado: 'llego', upd: t }).catch(() => { });
  render();
}
function entregado(o) {
  const t = Date.now();
  updateDoc(ref('pedidos', o.id), { estado: 'entregado', entregaT: t, upd: t }).catch(e => toast('No se pudo guardar: ' + e.code));
  if (o.track) updateDoc(ref('track', o.track), { estado: 'entregado', upd: t, antes: 0 }).catch(() => { });
  orders = orders.filter(x => x.id !== o.id);
  toast('Entregado a ' + (o.nombre || 'cliente'), 'Deshacer', () => {
    const u = Date.now();
    updateDoc(ref('pedidos', o.id), { estado: 'camino', entregaT: deleteField(), upd: u }).catch(() => { });
    if (o.track) updateDoc(ref('track', o.track), { estado: 'llego', upd: u }).catch(() => { });
  });
  sync();
}
function salir() {
  const ids = listos.filter(o => !quitados.has(o.id));
  if (!ids.length) return;
  const t = Date.now(), base = orders.length;
  ids.forEach((o, i) => {
    updateDoc(ref('pedidos', o.id), { estado: 'camino', repartidor: ME, repartidorEmail: EMAIL, salio: t, orden: base + i, upd: t }).catch(e => toast('No se pudo guardar: ' + e.code));
    if (o.track) updateDoc(ref('track', o.track), { estado: 'camino', repartidor: ME, salio: t, upd: t }).catch(() => { });
  });
  listos = listos.filter(o => !ids.includes(o)); // enseguida llegan por la otra consulta como "en camino"
  toast('Saliste con ' + ids.length + (ids.length > 1 ? ' pedidos' : ' pedido'));
  render();
}
function primero(o) { order = [o.id, ...stops().map(x => x.id).filter(id => id !== o.id)]; ls.set('rep_order', JSON.stringify(order)); sync(); }
let tt = 0;
function toast(msg, label, fn) {
  document.querySelectorAll('.toast').forEach(x => x.remove());
  const d = document.createElement('div'); d.className = 'toast'; d.textContent = msg;
  if (label) { const b = document.createElement('button'); b.textContent = label; b.onclick = () => { fn(); d.remove(); }; d.appendChild(b); }
  document.body.appendChild(d); clearTimeout(tt); tt = setTimeout(() => d.remove(), label ? 7000 : 2500);
}

/* ── pantalla ── */
// Google Maps: se abre la app del celu con la navegación lista. Usamos el texto de la dirección (Google la ubica mejor que nosotros).
const mapsQ = o => o.dir ? o.dir + ', Buenos Aires, Argentina' : (o.geo ? o.geo.lat + ',' + o.geo.lng : '');
const navUrl = o => 'https://www.google.com/maps/dir/?api=1&travelmode=driving&dir_action=navigate&destination=' + encodeURIComponent(mapsQ(o));
const routeUrl = s => { const p = s.slice(0, 10), last = p[p.length - 1], mid = p.slice(0, -1).map(mapsQ).join('|');
  return 'https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=' + encodeURIComponent(mapsQ(last)) + (mid ? '&waypoints=' + encodeURIComponent(mid) : ''); };

/* ── mapa de navegación dentro de la app (la app queda abierta, así el GPS no se corta) ── */
const ARROW = '<svg viewBox="0 0 16 16"><path d="M8 1L14 14L8 11L2 14Z" fill="#000"/></svg>';
const HOUSE = '<svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11L12 3L21 11M6 9.5V21H18V9.5"/></svg>';
const navWrap = document.createElement('div'); navWrap.className = 'navwrap';
navWrap.innerHTML = '<div class="navbar"><span class="na">↑</span><div class="nt"><b class="nd"></b><span class="nx"></span></div><button class="chip nvoz" type="button"></button></div><div id="navmap"></div><button class="btn ncen" type="button">Ver ruta</button>';
const nq = c => navWrap.querySelector(c);
let nmap = null, meM = null, routeLine = null, route = null, stepIdx = 1, follow = true, fetching = false, lastFetch = 0, voz = ls.get('rep_voz') !== '0';
const destMs = {}, spoken = new Set();
const nicon = (html, size) => L.divIcon({ html, className: '', iconSize: [size, size], iconAnchor: [size / 2, size / 2] });
function setVoz(on, speakIt) { voz = on; ls.set('rep_voz', on ? '1' : '0'); nq('.nvoz').textContent = on ? 'Voz: sí' : 'Voz: no'; if (on && speakIt) hablar('Voz activada'); if (!on && window.speechSynthesis) speechSynthesis.cancel(); }
function hablar(t) { try { if (!voz || !window.speechSynthesis) return; const u = new SpeechSynthesisUtterance(t); u.lang = 'es-AR'; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch { } }
nq('.nvoz').onclick = () => setVoz(!voz, true); setVoz(voz, false);
nq('.ncen').onclick = () => {
  if (!nmap) return;
  if (follow) { follow = false; nq('.ncen').textContent = 'Seguirme'; const s = stops(), pts = [pos, ...s.filter(o => o.geo)].filter(Boolean).map(p => [p.lat, p.lng]); if (pts.length > 1) nmap.fitBounds(pts, { padding: [40, 40], maxZoom: 17 }); }
  else { follow = true; nq('.ncen').textContent = 'Ver ruta'; if (pos) nmap.setView([pos.lat, pos.lng], Math.max(nmap.getZoom(), 16)); }
};
function ensureMap() {
  if (nmap || !window.L) return;
  try {
    const b = LOC && LOC.base && isFinite(LOC.base.lat) ? LOC.base : { lat: -34.6037, lng: -58.3816 };
    nmap = L.map(nq('#navmap'), { zoomControl: false, attributionControl: true }).setView([pos ? pos.lat : b.lat, pos ? pos.lng : b.lng], 16);
    baseMap(nmap); nmap.attributionControl.setPrefix(false);
    nmap.on('dragstart', () => { if (follow) { follow = false; nq('.ncen').textContent = 'Seguirme'; } });
  } catch (e) { console.error(e); nmap = null; navWrap.querySelector('#navmap').hidden = true; }
}
function segProj(p, a, b) {
  const k = Math.cos(p.lat * Math.PI / 180), R = 111320;
  const ax = (a[1] - p.lng) * k * R, ay = (a[0] - p.lat) * R, bx = (b[1] - p.lng) * k * R, by = (b[0] - p.lat) * R, dx = bx - ax, dy = by - ay, L2 = (dx * dx + dy * dy) || 1;
  const t = Math.max(0, Math.min(1, -(ax * dx + ay * dy) / L2));
  return { d: Math.hypot(ax + t * dx, ay + t * dy), t, len: Math.sqrt(L2) };
}
/* Distancia de p a la ruta y metros ya recorridos sobre ella. */
function onRoute(p, rt) {
  let best = { d: 1e9, at: 0 };
  for (let i = 1; i < rt.coords.length; i++) { const q = segProj(p, rt.coords[i - 1], rt.coords[i]); if (q.d < best.d) best = { d: q.d, at: rt.cum[i - 1] + q.t * q.len }; }
  return best;
}
const DIRS = { 'left': 'a la izquierda', 'right': 'a la derecha', 'slight left': 'levemente a la izquierda', 'slight right': 'levemente a la derecha', 'sharp left': 'cerrado a la izquierda', 'sharp right': 'cerrado a la derecha' };
const ARR = { 'left': '←', 'right': '→', 'slight left': '↖', 'slight right': '↗', 'sharp left': '↙', 'sharp right': '↘', 'straight': '↑', 'uturn': '↶' };
function say(st) {
  const m = st.maneuver || {}, n = st.name ? ' por ' + st.name : '', mod = m.modifier || 'straight';
  if (m.type === 'arrive') return { a: '⚑', t: 'Llegás a destino' };
  if (/roundabout|rotary/.test(m.type)) return { a: '↻', t: 'En la rotonda, salida ' + (m.exit || '') + n };
  if (mod === 'uturn') return { a: '↶', t: 'Hacé la vuelta en U' + n };
  if (mod === 'straight' || m.type === 'continue' || m.type === 'new name') return { a: '↑', t: 'Seguí derecho' + n };
  return { a: ARR[mod] || '↑', t: 'Girá ' + (DIRS[mod] || '') + n };
}
async function fetchRoute(cur) {
  fetching = true; lastFetch = Date.now();
  try {
    const u = 'https://router.project-osrm.org/route/v1/driving/' + pos.lng + ',' + pos.lat + ';' + cur.geo.lng + ',' + cur.geo.lat + '?overview=full&geometries=geojson&steps=true';
    const j = await (await fetch(u)).json(), rt = j.routes && j.routes[0];
    if (!rt) throw new Error('sin ruta');
    route = { id: cur.id, t: Date.now(), coords: rt.geometry.coordinates.map(c => [c[1], c[0]]), steps: rt.legs[0].steps, dist: rt.distance, dur: rt.duration };
    route.cum = [0]; for (let i = 1; i < route.coords.length; i++) route.cum.push(route.cum[i - 1] + GEO.dist({ lat: route.coords[i - 1][0], lng: route.coords[i - 1][1] }, { lat: route.coords[i][0], lng: route.coords[i][1] }));
    route.stepAt = []; let acc = 0; route.steps.forEach(st => { route.stepAt.push(acc); acc += st.distance; });
    stepIdx = 1; spoken.clear();
    if (nmap) { if (routeLine) routeLine.remove(); routeLine = L.polyline(route.coords, { color: getComputedStyle(document.documentElement).getPropertyValue('--acc').trim() || '#F1BB00', weight: 6, opacity: .95, lineCap: 'round', lineJoin: 'round' }).addTo(nmap); }
  } catch (e) { console.warn('ruta', e); }
  fetching = false; updateNav();
}
function updateNav() {
  const s = stops(), cur = s[0];
  if (!cur || !navWrap.isConnected) return;
  const bar = { a: nq('.na'), d: nq('.nd'), x: nq('.nx') };
  if (nmap) {
    if (pos) {
      if (!meM) meM = L.marker([pos.lat, pos.lng], { icon: nicon('<div class="mk-me"><div class="dot">' + ARROW + '</div></div>', 44), interactive: false, keyboard: false, zIndexOffset: 1000 }).addTo(nmap);
      else meM.setLatLng([pos.lat, pos.lng]);
      const dot = meM.getElement() && meM.getElement().querySelector('.dot'); if (dot) dot.style.transform = 'rotate(' + (pos.hdg || 0) + 'deg)';
      if (follow) nmap.setView([pos.lat, pos.lng], Math.max(nmap.getZoom(), 16), { animate: false });
    }
    s.forEach((o, i) => {
      if (!o.geo) return;
      const html = i === 0 ? '<div class="mk-dest">' + HOUSE + '</div>' : '<div class="mk-stop">' + (i + 1) + '</div>', sz = i === 0 ? 40 : 28, key = o.id + (i === 0 ? 'c' : 'n');
      if (destMs[o.id] && destMs[o.id].key !== key) { destMs[o.id].m.remove(); delete destMs[o.id]; }
      if (!destMs[o.id]) destMs[o.id] = { key, m: L.marker([o.geo.lat, o.geo.lng], { icon: nicon(html, sz), interactive: false, keyboard: false }).addTo(nmap) };
    });
    Object.keys(destMs).forEach(id => { if (!s.some(o => o.id === id)) { destMs[id].m.remove(); delete destMs[id]; } });
  }
  if (!pos) { bar.a.textContent = '…'; bar.d.textContent = 'Buscando GPS'; bar.x.textContent = 'Un momento'; return; }
  if (!cur.geo) { bar.a.textContent = '?'; bar.d.textContent = 'Sin ubicar'; bar.x.textContent = 'No encuentro esa dirección en el mapa. Usá «Ir con Google Maps».'; return; }
  const prog = route && route.id === cur.id ? onRoute(pos, route) : null, off = !!prog && prog.d > 80;
  if (route && route.id !== cur.id) route = null;
  if (!fetching && (!route || off) && Date.now() - lastFetch > 15000) fetchRoute(cur);
  if (!route) { const d = GEO.dist(pos, cur.geo); bar.a.textContent = '↑'; bar.d.textContent = d >= 1000 ? (d / 1000).toFixed(1) + ' km' : Math.round(d / 10) * 10 + ' m'; bar.x.textContent = 'Calculando ruta…'; return; }
  while (stepIdx < route.steps.length - 1 && route.stepAt[stepIdx] < prog.at - 20) stepIdx++;
  const st = route.steps[stepIdx], sy = say(st), d = Math.max(0, route.stepAt[stepIdx] - prog.at);
  bar.a.textContent = sy.a;
  bar.d.textContent = d >= 1000 ? (d / 1000).toFixed(1) + ' km' : Math.max(10, Math.round(d / 10) * 10) + ' m';
  bar.x.textContent = sy.t;
  if (d < 180 && !spoken.has(stepIdx + 'a') && d >= 45) { spoken.add(stepIdx + 'a'); hablar('En ' + Math.round(d / 10) * 10 + ' metros, ' + sy.t); }
  if (d < 45 && !spoken.has(stepIdx + 'b')) { spoken.add(stepIdx + 'b'); spoken.add(stepIdx + 'a'); hablar(sy.t); }
}
function attachNav() {
  const slot = document.getElementById('mapslot');
  if (!slot) return;
  if (navWrap.parentNode !== slot) slot.appendChild(navWrap);
  ensureMap();
  if (nmap) setTimeout(() => nmap.invalidateSize(), 0);
  updateNav();
}
function render() {
  if (!ME) return;
  const s = stops(), cur = s[0];
  const gpsChip = { ok: ['ok', 'GPS activo'], wait: ['warn', 'Buscando GPS…'], denied: ['warn', 'GPS sin permiso'], no: ['warn', 'Sin GPS'], idle: ['', 'GPS en espera'] }[gps];
  const head = '<header class="rh"><span class="wm">' + esc(LOC.nombre || 'Shivo\'s') + '</span><span class="rt">Reparto</span><span class="sp"></span>' +
    '<span class="chip ' + gpsChip[0] + '"><i></i>' + gpsChip[1] + '</span><button class="chip" id="who" aria-label="Salir">' + esc(ME) + '</button></header>';
  let body, act = '';
  const chosen = listos.filter(o => !quitados.has(o.id));
  const listosHtml = listos.length ? '<h3>Listos para salir</h3>' + listos.map(o => {
    const cobrar = +o.cobrar || 0;
    return '<label class="card pick"><input type="checkbox" data-pick="' + o.id + '"' + (quitados.has(o.id) ? '' : ' checked') + '><span class="cb"><span class="cn">#' + o.num + ' ' + esc(o.nombre) + '</span><span class="cd">' + esc(o.dir) + (o.depto ? ' · ' + esc(o.depto) : '') + '</span>' + (o.nota ? '<span class="cm">' + esc(o.nota) + '</span>' : '') + '</span>' +
      '<span class="pay ' + (cobrar > 0 ? 'cobrar' : 'ok') + '">' + (cobrar > 0 ? 'Cobrar ' + money(cobrar) : 'Pagado') + '</span></label>';
  }).join('') + (s.length ? '<button class="btn y" id="salir2"' + (chosen.length ? '' : ' disabled') + '>Sumar al recorrido (' + chosen.length + ')</button>' : '') : '';
  if (!s.length && !listos.length) {
    body = '<div class="center"><h2>Sin pedidos para repartir</h2><p class="muted">Cuando un pedido esté listo en el local aparece acá. Elegís cuáles llevás y tocás «Salir». El GPS se prende solo.</p></div>';
  } else if (!s.length) {
    body = '<div class="scroll">' + listosHtml + '</div>';
    act = '<div class="act"><button class="go" id="salir"' + (chosen.length ? '' : ' disabled') + '>Salir con ' + chosen.length + (chosen.length === 1 ? ' pedido' : ' pedidos') + '</button></div>';
  } else {
    const warn = gps === 'denied' ? '<div class="banner">Activá la ubicación de este navegador para que el cliente vea la moto: Ajustes del celu, Safari o Chrome, Ubicación, Permitir.</div>'
      : gps === 'ok' && !lock ? '<div class="banner">Dejá esta pantalla abierta y prendida mientras repartís. Si cambiás de app o apagás la pantalla, el cliente deja de ver la moto.</div>' : '';
    const ruta = s.length > 1 ? '<a class="btn" href="' + esc(routeUrl(s)) + '" target="_blank" rel="noopener">Ruta completa en Google Maps (' + Math.min(s.length, 10) + ' paradas)</a>' : '';
    const hint = '<div class="cm">Mientras Google Maps está abierto, el cliente no ve la moto en vivo. Al llegar, volvé a esta app y tocá «Llegué».</div>';
    body = '<div class="scroll">' + warn + '<div id="mapslot"></div>' + ruta + hint + s.map((o, i) => {
      const on = i === 0, cobrar = +o.cobrar || 0;
      return '<div class="card' + (on ? ' on' : '') + '"><div class="ct"><div class="num">' + (i + 1) + '</div><div class="cb"><span class="cn">' + esc(o.nombre) + '</span><span class="cd">' + esc(o.dir) + (o.depto ? ' · ' + esc(o.depto) : '') + '</span>' +
        '<span class="cm"><span>Pedido #' + o.num + '</span>' + (o.nota ? '<span>' + esc(o.nota) + '</span>' : '') + '</span></div>' +
        '<span class="pay ' + (cobrar > 0 ? 'cobrar' : 'ok') + '">' + (cobrar > 0 ? 'Cobrar ' + money(cobrar) : 'Pagado') + '</span></div>' +
        '<div class="row">' + (mapsQ(o) ? '<a class="btn y" href="' + esc(navUrl(o)) + '" target="_blank" rel="noopener">Ir con Google Maps</a>' : '') + (o.tel ? '<a class="btn" href="tel:' + esc(String(o.tel).replace(/[^\d+]/g, '')) + '">Llamar</a>' : '') + (!on ? '<button class="btn" data-first="' + o.id + '">Ir primero</button>' : '') + '</div></div>';
    }).join('') + listosHtml + '</div>';
    const got = !!cur.llegoT;
    act = '<div class="act"><button class="go ' + (got ? 'ok' : '') + '" id="go">' + (got ? 'Entregado ✓' : 'Llegué a ' + esc(cur.nombre || 'destino')) + '</button></div>';
  }
  const html = head + body + act;
  if (html === render.last) { updateNav(); return; } // no tocamos el DOM si no cambió nada visible: así no se pierden toques
  $app.innerHTML = html; render.last = html;
  const w = document.getElementById('who'); if (w) w.onclick = logout;
  document.querySelectorAll('[data-first]').forEach(b => b.onclick = () => primero(orders.find(x => x.id === b.dataset.first)));
  document.querySelectorAll('[data-pick]').forEach(c => c.onchange = () => { c.checked ? quitados.delete(c.dataset.pick) : quitados.add(c.dataset.pick); render(); });
  ['salir', 'salir2'].forEach(id => { const b = document.getElementById(id); if (b) b.onclick = salir; });
  const g = document.getElementById('go'); if (g) g.onclick = () => { const o = stops()[0]; o.llegoT ? entregado(o) : llego(o); };
  attachNav();
}
setInterval(() => { if (ME) render(); }, 15000);
</script>
